name: Trigger auto deployment for cap-test-mounika-191026

# When this action will be executed
on:
  # Automatically trigger it when detected changes in repo
  push:
    branches: 
      [ master ]
    paths:
    - '**'
    - '.github/workflows/cap-test-mounika-191026-AutoDeployTrigger-4334c2d2-b8a0-40fa-b4a1-30709e9bc9d3.yml'

  # Allow manual trigger 
  workflow_dispatch:      

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions: 
      id-token: write #This is required for requesting the OIDC JWT Token
      contents: read #Required when GH token is used to authenticate with private repo

    steps:
      - name: Checkout to the branch
        uses: actions/checkout@v2

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.CAPTESTMOUNIKA191026_AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.CAPTESTMOUNIKA191026_AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.CAPTESTMOUNIKA191026_AZURE_SUBSCRIPTION_ID }}

      - name: Build and push container image to registry
        uses: azure/container-apps-deploy-action@v2
        with:
          appSourcePath: ${{ github.workspace }}
          _dockerfilePathKey_: _dockerfilePath_
          _targetLabelKey_: _targetLabel_
          registryUrl: 
          registryUsername: ${{ secrets.CAPTESTMOUNIKA191026_REGISTRY_USERNAME }}
          registryPassword: ${{ secrets.CAPTESTMOUNIKA191026_REGISTRY_PASSWORD }}
          containerAppName: cap-test-mounika-191026
          resourceGroup: OGF-test-mounika-131026
          imageToBuild: default/[parameters('containerAppName')]:${{ github.sha }}
          _buildArgumentsKey_: |
            _buildArgumentsValues_


