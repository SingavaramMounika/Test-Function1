name: Trigger auto deployment for cap-test-mounika-nov6-25837815

# When this action will be executed
on:
  # Automatically trigger it when detected changes in repo
  push:
    branches: 
      [ master ]
    paths:
    - '**'
    - '.github/workflows/cap-test-mounika-nov6-25837815-AutoDeployTrigger-be408d61-25bf-4173-8f27-6b6666adffaa.yml'

  # Allow manual trigger 
  workflow_dispatch:      

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions: 
      id-token: write #This is required for requesting the OIDC JWT Token
      contents: read #Required when GH token is used to authenticate with private repo

    steps:
      - name: Checkout to the branch
        uses: actions/checkout@v2

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.CAPTESTMOUNIKANOV625837815_AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.CAPTESTMOUNIKANOV625837815_AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.CAPTESTMOUNIKANOV625837815_AZURE_SUBSCRIPTION_ID }}

      - name: Build and push container image to registry
        uses: azure/container-apps-deploy-action@v2
        with:
          appSourcePath: ${{ github.workspace }}
          _dockerfilePathKey_: _dockerfilePath_
          _targetLabelKey_: _targetLabel_
          registryUrl: 
          registryUsername: ${{ secrets.CAPTESTMOUNIKANOV625837815_REGISTRY_USERNAME }}
          registryPassword: ${{ secrets.CAPTESTMOUNIKANOV625837815_REGISTRY_PASSWORD }}
          containerAppName: cap-test-mounika-nov6-25837815
          resourceGroup: cap-ogf-test-mounika
          imageToBuild: default/[parameters('containerAppName')]:${{ github.sha }}
          _buildArgumentsKey_: |
            _buildArgumentsValues_


