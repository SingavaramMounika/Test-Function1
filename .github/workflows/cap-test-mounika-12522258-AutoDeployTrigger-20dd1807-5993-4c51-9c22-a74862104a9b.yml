name: Trigger auto deployment for cap-test-mounika-12522258

# When this action will be executed
on:
  # Automatically trigger it when detected changes in repo
  push:
    branches: 
      [ master ]
    paths:
    - '**'
    - '.github/workflows/cap-test-mounika-12522258-AutoDeployTrigger-20dd1807-5993-4c51-9c22-a74862104a9b.yml'

  # Allow manual trigger 
  workflow_dispatch:      

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions: 
      id-token: write #This is required for requesting the OIDC JWT Token
      contents: read #Required when GH token is used to authenticate with private repo

    steps:
      - name: Checkout to the branch
        uses: actions/checkout@v2

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.CAPTESTMOUNIKA12522258_AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.CAPTESTMOUNIKA12522258_AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.CAPTESTMOUNIKA12522258_AZURE_SUBSCRIPTION_ID }}

      - name: Build and push container image to registry
        uses: azure/container-apps-deploy-action@v2
        with:
          appSourcePath: ${{ github.workspace }}
          _dockerfilePathKey_: _dockerfilePath_
          _targetLabelKey_: _targetLabel_
          registryUrl: registrymounika3009.azurecr.io
          registryUsername: ${{ secrets.CAPTESTMOUNIKA12522258_REGISTRY_USERNAME }}
          registryPassword: ${{ secrets.CAPTESTMOUNIKA12522258_REGISTRY_PASSWORD }}
          containerAppName: cap-test-mounika-12522258
          resourceGroup: cap-ogf-test-mounika
          imageToBuild: registrymounika3009.azurecr.io/cap-test-mounika-12522258:${{ github.sha }}
          _buildArgumentsKey_: |
            _buildArgumentsValues_


