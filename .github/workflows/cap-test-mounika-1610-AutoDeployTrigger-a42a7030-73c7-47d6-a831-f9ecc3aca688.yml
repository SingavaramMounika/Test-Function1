name: Trigger auto deployment for cap-test-mounika-1610

# When this action will be executed
on:
  # Automatically trigger it when detected changes in repo
  push:
    branches: 
      [ master ]
    paths:
    - '**'
    - '.github/workflows/cap-test-mounika-1610-AutoDeployTrigger-a42a7030-73c7-47d6-a831-f9ecc3aca688.yml'

  # Allow manual trigger 
  workflow_dispatch:      

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions: 
      id-token: write #This is required for requesting the OIDC JWT Token
      contents: read #Required when GH token is used to authenticate with private repo

    steps:
      - name: Checkout to the branch
        uses: actions/checkout@v2

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.CAPTESTMOUNIKA1610_AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.CAPTESTMOUNIKA1610_AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.CAPTESTMOUNIKA1610_AZURE_SUBSCRIPTION_ID }}

      - name: Build and push container image to registry
        uses: azure/container-apps-deploy-action@v2
        with:
          appSourcePath: ${{ github.workspace }}
          _dockerfilePathKey_: _dockerfilePath_
          _targetLabelKey_: _targetLabel_
          registryUrl: acaregistry.azurecr.io
          registryUsername: ${{ secrets.CAPTESTMOUNIKA1610_REGISTRY_USERNAME }}
          registryPassword: ${{ secrets.CAPTESTMOUNIKA1610_REGISTRY_PASSWORD }}
          containerAppName: cap-test-mounika-1610
          resourceGroup: ogf-test-mounika-161026
          imageToBuild: acaregistry.azurecr.io/cap-test-mounika-1610:${{ github.sha }}
          _buildArgumentsKey_: |
            _buildArgumentsValues_


