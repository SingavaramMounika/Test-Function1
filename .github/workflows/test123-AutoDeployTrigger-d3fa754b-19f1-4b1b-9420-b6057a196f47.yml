name: Trigger auto deployment for test123

# When this action will be executed
on:
  # Automatically trigger it when detected changes in repo
  push:
    branches: 
      [ master ]
    paths:
    - '**'
    - '.github/workflows/test123-AutoDeployTrigger-d3fa754b-19f1-4b1b-9420-b6057a196f47.yml'

  # Allow manual trigger 
  workflow_dispatch:      

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions: 
      id-token: write #This is required for requesting the OIDC JWT Token
      contents: read #Required when GH token is used to authenticate with private repo

    steps:
      - name: Checkout to the branch
        uses: actions/checkout@v2

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.TEST123_AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.TEST123_AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.TEST123_AZURE_SUBSCRIPTION_ID }}

      - name: Build and push container image to registry
        uses: azure/container-apps-deploy-action@v2
        with:
          appSourcePath: ${{ github.workspace }}
          _dockerfilePathKey_: _dockerfilePath_
          _targetLabelKey_: _targetLabel_
          registryUrl: registrymounika3009.azurecr.io
          registryUsername: ${{ secrets.TEST123_REGISTRY_USERNAME }}
          registryPassword: ${{ secrets.TEST123_REGISTRY_PASSWORD }}
          containerAppName: test123
          resourceGroup: ogftestmounika1210-svm
          imageToBuild: registrymounika3009.azurecr.io/test123:${{ github.sha }}
          _buildArgumentsKey_: |
            _buildArgumentsValues_


