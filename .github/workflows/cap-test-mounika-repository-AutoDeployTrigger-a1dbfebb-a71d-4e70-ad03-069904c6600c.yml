name: Trigger auto deployment for cap-test-mounika-repository

# When this action will be executed
on:
  # Automatically trigger it when detected changes in repo
  push:
    branches: 
      [ testoctbranch ]
    paths:
    - '**'
    - '.github/workflows/cap-test-mounika-repository-AutoDeployTrigger-a1dbfebb-a71d-4e70-ad03-069904c6600c.yml'

  # Allow manual trigger 
  workflow_dispatch:      

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions: 
      id-token: write #This is required for requesting the OIDC JWT Token
      contents: read #Required when GH token is used to authenticate with private repo

    steps:
      - name: Checkout to the branch
        uses: actions/checkout@v2

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.CAPTESTMOUNIKAREPOSITORY_AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.CAPTESTMOUNIKAREPOSITORY_AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.CAPTESTMOUNIKAREPOSITORY_AZURE_SUBSCRIPTION_ID }}

      - name: Build and push container image to registry
        uses: azure/container-apps-deploy-action@v2
        with:
          appSourcePath: ${{ github.workspace }}
          _dockerfilePathKey_: _dockerfilePath_
          _targetLabelKey_: _targetLabel_
          registryUrl: 
          registryUsername: ${{ secrets.CAPTESTMOUNIKAREPOSITORY_REGISTRY_USERNAME }}
          registryPassword: ${{ secrets.CAPTESTMOUNIKAREPOSITORY_REGISTRY_PASSWORD }}
          containerAppName: cap-test-mounika-repository
          resourceGroup: mounikatest0910
          imageToBuild: default/[parameters('containerAppName')]:${{ github.sha }}
          _buildArgumentsKey_: |
            _buildArgumentsValues_


